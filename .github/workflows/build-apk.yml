name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore bundled web app
        run: |
          base64 --decode app/src/main/assets/index.html.gz.b64 > /tmp/index.html.gz
          gzip --decompress --stdout /tmp/index.html.gz > app/src/main/assets/index.html
          wc -c app/src/main/assets/index.html
      - name: Verify bundled web app
        run: |
          test "$(wc -c < app/src/main/assets/index.html)" -eq 137903
          test "$(sha256sum app/src/main/assets/index.html | cut -d' ' -f1)" = "f125c6ada82442e4ca2dcd29ce2c8c2aeb8d65a6508f2e7244edfe57f547bcce"
          grep -q "backupFileInput" app/src/main/assets/index.html
          grep -q "금강마을 에어컨 설치비" app/src/main/assets/index.html
          grep -q "variableExpenseTotal" app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 우리집-가계부-v17-final-apk
          path: app/build/outputs/apk/debug/app-debug.apk
