plugins { id 'com.android.application' }

android {
    namespace 'com.openai.ourhomebudget.v21'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.ourhomebudget.v21'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '21.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
