name: Build Android APK

on:
  push:
    branches: [ main, v17-final-build, v21-auto-import ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore bundled web app
        run: |
          python3 - <<'PY'
          import base64, pathlib, zlib, hashlib
          root = pathlib.Path('app/src/main/assets')
          data = ''.join((root / f'index.html.gz.b64.part{i}').read_text().strip() for i in range(1, 8))
          raw = base64.b64decode(data)
          pos = 10
          flg = raw[3]
          if flg & 4:
              xlen = int.from_bytes(raw[pos:pos+2], 'little'); pos += 2 + xlen
          if flg & 8:
              pos = raw.index(b'\0', pos) + 1
          if flg & 16:
              pos = raw.index(b'\0', pos) + 1
          if flg & 2:
              pos += 2
          dec = zlib.decompressobj(-zlib.MAX_WBITS)
          html = dec.decompress(raw[pos:-8]) + dec.flush()
          (root / 'index.html').write_bytes(html)
          print('restored', len(html), 'bytes', hashlib.sha256(html).hexdigest())
          PY
      - name: Verify bundled web app
        run: |
          test -s app/src/main/assets/index.html
          test "$(wc -c < app/src/main/assets/index.html)" -eq 137903
          test "$(sha256sum app/src/main/assets/index.html | cut -d' ' -f1)" = "8277744594f7aed60c263a0f9399f5e645eabdfcd82119be050ca4d610820b92"
          grep -q "backupFileInput" app/src/main/assets/index.html
          grep -q "금강마을 에어컨 설치비" app/src/main/assets/index.html
          grep -q "variableExpenseTotal" app/src/main/assets/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-web-source
          path: app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 우리집-가계부-v21-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
