<!doctype html><html lang="ko"><meta charset="utf-8"><title>우리집 가계부</title><body><p>가계부 로딩 중...</p><script>fetch('index.html.gz.b64').then(r=>r.text()).then(async b=>{const bin=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}).catch(e=>document.body.innerHTML='<h3>가계부 로드 오류</h3><pre>'+e+'</pre>');</script></body></html>
